name: Bug report
description: Create a report to help us improve Plainpad
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Press Alt+A to bring up scratchpad
        2. Type '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Ubuntu / Debian (GNOME/X11)
        - Ubuntu / Debian (Wayland)
        - Arch Linux
        - Fedora
        - Other Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Additional Context & Logs
      description: Add any screenshots, logs from terminal, or other context.
