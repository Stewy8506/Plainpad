<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plainpad</title>
  <meta name="description" content="Plainpad — the scratchpad where you just write, and the app works out the rest." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Top chrome bar: note navigation, drag region & window controls -->
  <div id="top-bar" class="chrome-bar" data-tauri-drag-region>
    <div class="chrome-group">
      <button id="btn-prev" class="chrome-btn" title="Previous note (Ctrl+←)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13L5 8l5-5"/></svg></button>
      <span id="note-index" class="note-index">1/1</span>
      <button id="btn-next" class="chrome-btn" title="Next note (Ctrl+→)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></button>
      <button id="btn-pin" class="chrome-btn" title="Pin note to top of list"><svg class="icon-pin" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5l1.9 4.3 4.6.4-3.5 3.1 1 4.6L8 11.5l-4 2.4 1-4.6L1.5 6.2l4.6-.4L8 1.5z"/></svg></button>
      <button id="btn-plain" class="chrome-btn" title="Plain mode (Ctrl+P)"><svg class="icon-plain" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><circle class="plain-dot" cx="8" cy="8" r="2.5" fill="none"/></svg></button>
    </div>
    <div class="bar-spacer" data-tauri-drag-region></div>
    <div class="chrome-group window-controls">
      <button id="btn-always-on-top" class="chrome-btn" title="Always on Top"><svg class="icon-window-pin" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5h7l-1 5 2.5 1.5v1.5h-4.25v4.5l-.75.75-.75-.75V10.5H3V9l2.5-1.5-1-5z"/></svg></button>
      <button id="btn-minimize" class="chrome-btn" title="Minimize"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="3" y1="8" x2="13" y2="8"/></svg></button>
      <button id="btn-maximize" class="chrome-btn" title="Maximize"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg></button>
      <button id="btn-close" class="chrome-btn btn-close-win" title="Close / Hide (Esc)"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
  </div>

  <!-- Main editor area -->
  <div id="editor-container">
    <!-- Syntax-highlighted backdrop (renders colored mode keywords, variables, comments) -->
    <div id="editor-backdrop" aria-hidden="true"></div>
    <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"
      placeholder="Just start typing…"></textarea>
    <!-- Hidden mirror for line measurement -->
    <div id="editor-mirror" aria-hidden="true"></div>
    <!-- Overlay for annotations (math results, chips, checkboxes) -->
    <div id="editor-overlay" aria-hidden="true"></div>
  </div>

  <!-- Timer display (shown when timers are active) -->
  <div id="timer-display" class="hidden"></div>

  <!-- Bottom chrome bar: actions (hover-revealed) -->
  <div id="bottom-bar" class="chrome-bar">
    <button id="btn-new" class="chrome-btn" title="New note (Ctrl+N)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></svg></button>
    <button id="btn-delete" class="chrome-btn" title="Delete note (Ctrl+Shift+D)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10M5.5 4.5V3a1 1 0 011-1h3a1 1 0 011 1v1.5m-6.5 0v8a1.5 1.5 0 001.5 1.5h4a1.5 1.5 0 001.5-1.5v-8"/></svg></button>
    <button id="btn-export" class="chrome-btn" title="Export (Ctrl+Shift+E)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v9M4.5 6L8 2.5 11.5 6M2.5 11.5v2a1 1 0 001 1h9a1 1 0 001-1v-2"/></svg></button>
    <div class="bar-spacer"></div>
    <span id="sync-status" class="sync-status"></span>
    <button id="btn-settings" class="chrome-btn" title="Settings"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.5"/><path d="M13.5 8a5.5 5.5 0 00-.1-.9l1.4-1.1-1.3-2.3-1.7.6a5.5 5.5 0 00-1.5-.9L10 1.7H7.4l-.3 1.7a5.5 5.5 0 00-1.5.9l-1.7-.6-1.3 2.3 1.4 1.1A5.5 5.5 0 003.9 8a5.5 5.5 0 00.1.9l-1.4 1.1 1.3 2.3 1.7-.6a5.5 5.5 0 001.5.9l.3 1.7h2.6l.3-1.7a5.5 5.5 0 001.5-.9l1.7.6 1.3-2.3-1.4-1.1c.1-.3.1-.6.1-.9z"/></svg></button>
  </div>



  <script type="module" src="main.js"></script>
</body>
</html>
